<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mesa de Shalock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Alegreya+Sans:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Una columna de mesa: lo que dice el DM, la tirada pedida, el envío. Tema oscuro deliberado. */
:root{
  --bg:#14110f; --panel:#1f1a17; --line:#3a302a; --fg:#e8dfd4; --muted:#a3968a;
  --ember:#d9772b; --ok:#7fae6a; --bad:#cf5b4f;
  --display:"Cinzel",Georgia,serif; --body:"Alegreya Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header{display:flex;justify-content:space-between;align-items:end;gap:12px}
h1{font-family:var(--display);font-size:1.5rem;margin:0;letter-spacing:.04em}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:10px}
#mensaje{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.tirada{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.nombre{font-weight:700;font-size:1.1rem}
.mod{font-family:var(--mono);color:var(--ember)}
button{font:inherit;font-weight:700;background:var(--ember);color:var(--bg);border:0;border-radius:6px;padding:14px 18px;cursor:pointer;width:100%}
button.sec{background:transparent;color:var(--muted);border:1px solid var(--line);padding:6px 10px;width:auto;font-weight:400;font-size:.85rem}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
input{font:inherit;font-family:var(--mono);font-size:.85rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:10px;width:100%}
.resultado{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dado{font-family:var(--mono);font-size:2.6rem;line-height:1}
.total{font-family:var(--mono);font-size:1.2rem;color:var(--muted)}
.estado{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.estado.ok{color:var(--ok)} .estado.bad{color:var(--bad)}
.pie{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.turno{font-family:var(--display);font-size:1.05rem}
.banner{font-family:var(--display);font-size:1.2rem;text-align:center;padding:10px;border-radius:6px;border:1px solid var(--line)}
.banner.tuyo{background:var(--ember);color:var(--bg);border-color:var(--ember)}
.grupo{display:grid;gap:8px}
.grupo>.eyebrow{margin-top:4px}
.ap{font-size:.8rem;border-radius:999px;padding:1px 10px;border:1px solid currentColor}
.ap.ileso{color:var(--ok)} .ap.herido{color:var(--ember)} .ap.muy{color:var(--bad)} .ap.caido{color:var(--muted)}
.pips{letter-spacing:2px;color:var(--ember);font-size:1.05rem}
/* Toques cómodos en el celular: 44 px mínimo y texto de 16 px (sin zoom automático). */
button,select,input{min-height:44px;font-size:16px}
input[type=checkbox],input[type=radio]{min-height:0;width:22px;height:22px;accent-color:var(--ember)}
.opciones label{min-height:40px}
.acc,button.sec{min-height:44px}
/* Orden de iniciativa compacto, desplazable de lado. */
.orden{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.orden span{flex:0 0 auto;font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.orden span.actual{background:var(--ember);color:var(--bg);border-color:var(--ember);font-weight:700}
.orden span.fuera{opacity:.4;text-decoration:line-through}
.orden span.enemigo{border-style:dashed}
.economia{display:flex;gap:6px;flex-wrap:wrap}
.economia span{font-size:.85rem;border-radius:6px;padding:4px 10px;border:1px solid var(--ok);color:var(--ok)}
.economia span.usada{border-color:var(--line);color:var(--muted);text-decoration:line-through}
.pips .vacio{color:var(--line)}

.lista{display:grid;gap:8px}
.c{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:4px}
.c.actual{border-color:var(--ember)}
.c.fuera{opacity:.45}
.c-cab{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.c-nombre{font-weight:700}
.c-dato{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.c-desc{font-size:.9rem;color:var(--muted)}
.barra{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--ok)}
.barra.media>i{background:var(--ember)} .barra.baja>i{background:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.chip.on{border-color:var(--ember);color:var(--ember)}
.recursos{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.rec{border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.rec b{font-family:var(--mono);font-size:1.1rem;display:block}
.acciones{display:grid;gap:8px}
.acc{background:transparent;color:var(--fg);border:1px solid var(--line);text-align:left;font-weight:400;padding:10px 12px}
.acc.sel{border-color:var(--ember);background:#2a211b}
.acc small{display:block;font-family:var(--mono);color:var(--muted)}
select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:10px;width:100%}
.opciones{display:flex;gap:14px;flex-wrap:wrap;font-size:.95rem}
.opciones label{display:flex;gap:6px;align-items:center;color:var(--fg)}
.sub{display:grid;gap:8px;padding-left:10px;border-left:2px solid var(--line)}
.sub:empty{display:none}
@media (prefers-reduced-motion:no-preference){.dado.rueda{animation:r .35s ease-out}@keyframes r{from{transform:rotate(-200deg) scale(.6);opacity:.3}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="eyebrow">Proyecto Gran Torre</div><h1>Mesa de Shalock</h1></div>
    <button class="sec" id="abrirAjustes">Conexión</button>
  </header>

  <section class="panel" id="ajustes" hidden>
    <div class="eyebrow">Conexión con la mesa</div>
    <label for="repo">Repositorio de datos<input id="repo" placeholder="usuario/mesa-datos" autocomplete="off"></label>
    <label for="token">Token<input id="token" type="password" placeholder="github_pat_…" autocomplete="off"></label>
    <button id="guardar">Guardar en este dispositivo</button>
    <div class="estado">Se guarda solo en este navegador.</div>
  </section>

  <section class="panel" aria-live="polite">
    <div class="eyebrow">Lo que dice el DM</div>
    <p id="mensaje">Conectando…</p>
  </section>

  <section class="panel" id="panelPedido">
    <div class="eyebrow">Tirada pedida</div>
    <div class="tirada"><span class="nombre" id="nombre">Ninguna por ahora</span><span class="mod" id="mod"></span></div>
    <div class="resultado" id="resultado" hidden><span class="dado" id="dado">–</span><span class="total" id="total"></span></div>
    <button id="tirar" disabled>Tirar y enviar al DM</button>
    <div class="estado" id="estado"></div>
  </section>

  <section class="panel" id="panelCombate" hidden>
    <div class="eyebrow">Combate</div>
    <div class="turno" id="turno"></div>
    <div class="orden" id="orden" aria-label="Orden de iniciativa"></div>
    <div class="lista" id="combatientes"></div>
  </section>

  <section class="panel" id="panelShalock" hidden>
    <div class="eyebrow">Shalock</div>
    <div class="recursos" id="recursos"></div>
    <div class="economia" id="economia"></div>
    <div class="chips" id="efectos"></div>
    <div class="sub" id="panelReaccion" hidden>
      <div class="eyebrow">Reacción disponible</div>
      <div id="motivoReaccion"></div>
      <label for="armaReaccion">Ataque de oportunidad con<select id="armaReaccion"></select></label>
      <button id="atacarReaccion">Atacar</button>
      <button class="sec" id="dejarReaccion">Dejarlo ir</button>
      <div class="estado" id="estadoReaccion"></div>
    </div>
    <div class="sub" id="panelDano" hidden>
      <div class="eyebrow">Ataque en curso</div>
      <div id="veredicto"></div>
      <div id="opcDano" hidden>
        <div class="opciones"><label id="lblCastigoDano"><input type="checkbox" id="castigoDano"> Castigo divino (2d8 radiante)</label></div>
        <label for="espCastigo">Espacio para el castigo<select id="espCastigo"></select></label>
        <button id="tirarDano">Tirar daño y enviar</button>
      </div>
      <div class="estado" id="resDano"></div>
      <div class="estado" id="estadoDano"></div>
      <button class="sec" id="cerrarDano" hidden>Listo</button>
    </div>
    <div class="eyebrow">Armar turno</div>
    <label for="selAdicional">Acción adicional<select id="selAdicional"></select></label>
    <div class="sub" id="cfgAdicional"></div>
    <label for="selAccion">Acción<select id="selAccion"></select></label>
    <div class="sub" id="cfgAccion"></div>
    <div class="opciones"><label><input type="radio" name="ordenAd" value="antes" checked> Adicional antes de la acción</label><label><input type="radio" name="ordenAd" value="despues"> Después</label></div>
    <label for="notas">Movimiento y notas<input id="notas" placeholder="Me acerco al capitán por la izquierda…"></label>
    <div class="estado" id="avisos"></div>
    <div class="estado" id="resTurno"></div>
    <button id="enviarTurno">Tirar y enviar turno</button>
    <div class="estado" id="estadoTurno"></div>
  </section>

  <div class="pie"><span id="conexion">Sin conectar</span><span id="hora"></span></div>
</div>

<script>
const $=id=>document.getElementById(id);
const API="https://api.github.com";
let cfg={repo:"",token:""}, etag=null, pedido=null, pendiente=null, enviados=new Set(), sondeo=null;

function leerCfg(){try{cfg=JSON.parse(localStorage.getItem("mesa_cfg")||"{}");}catch(e){cfg={}}cfg.repo=cfg.repo||"";cfg.token=cfg.token||""}
function guardarCfg(){try{localStorage.setItem("mesa_cfg",JSON.stringify(cfg))}catch(e){}}
try{enviados=new Set(JSON.parse(localStorage.getItem("mesa_enviados")||"[]"))}catch(e){}
function marcarEnviado(id){enviados.add(id);try{localStorage.setItem("mesa_enviados",JSON.stringify([...enviados].slice(-50)))}catch(e){}}

const fmtMod=m=>(m>=0?"+":"")+m;
function d(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return 1+(a[0]%n)}
function b64(s){const b=new TextEncoder().encode(s);let t="";for(const x of b)t+=String.fromCharCode(x);return btoa(t)}
function deB64(s){const t=atob(s.replace(/\n/g,""));return new TextDecoder().decode(Uint8Array.from(t,c=>c.charCodeAt(0)))}
function cabeceras(extra){return Object.assign({"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},extra||{})}

function pintar(e){
  $("mensaje").textContent=e.mensaje||"Sin novedades.";
  pedido=e.tirada||null;
  if(pedido){
    $("nombre").textContent=pedido.nombre||"Tirada";
    $("mod").textContent=(pedido.expresion||"1d20")+" "+fmtMod(Number(pedido.mod)||0);
    $("tirar").disabled=enviados.has(pedido.id);
    if(!pendiente||pendiente.tirada.pedido!==pedido.id)$("tirar").textContent="Tirar y enviar al DM";
  }else{$("nombre").textContent="Ninguna por ahora";$("mod").textContent="";$("tirar").disabled=true}
  if(e.actualizado)$("hora").textContent="Actualizado "+new Date(e.actualizado).toLocaleTimeString();
  $("panelPedido").hidden=!pedido&&!!e.combate;
  pintarCombate(e.combate||null);
}

// ---- Combate ----
let combate=null, envioTurno=null;
const form={adicional:"",accion:"",orden:"antes",notas:"",c:{}}; // lo elegido sobrevive a cada actualización
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function barra(pg,max){const r=max?pg/max:0;return `<div class="barra ${r<=.25?"baja":r<=.5?"media":""}"><i style="width:${Math.max(0,Math.min(100,r*100))}%"></i></div>`}
const enemigos=()=>combate.combatientes.filter(c=>c.bando==="enemigo"&&c.activo).map(c=>c.id);
const aliados=()=>combate.combatientes.filter(c=>c.bando==="cuadrilla"&&c.activo).map(c=>c.id);
const opcion=id=>combate.shalock.opciones.find(o=>o.id===id);
const ataque=id=>combate.shalock.acciones.find(a=>a.id===id);

function pintarCombate(cb){
  combate=cb;
  $("panelCombate").hidden=!cb; $("panelShalock").hidden=!(cb&&cb.shalock);
  if(!cb)return;
  const tuyo=cb.turno==="Shalock";
  $("turno").innerHTML=`<div class="banner ${tuyo?"tuyo":""}">${tuyo?"Es tu turno":cb.turno?"Turno de "+esc(cb.turno):"Preparando el combate"}</div><div class="c-dato" style="text-align:center">Ronda ${cb.ronda}</div>`;
  const tarjeta=c=>{
    const cls={ileso:"ileso",herido:"herido","muy herido":"muy","caído":"caido"}[c.estado]||"";
    const vida=c.pg!=null?`<span class="c-dato">PG ${c.pg}/${c.pg_max}${c.pg_temporales?` +${c.pg_temporales}`:""}${c.ca!=null?` · CA ${c.ca}`:""}</span>`:`<span class="ap ${cls}">${esc(c.estado)}</span>`;
    const chips=[...c.condiciones.map(x=>`<span class="chip">${esc(x)}</span>`),c.concentracion?`<span class="chip on">concentrado: ${esc(c.concentracion)}</span>`:""].join("");
    return `<div class="c ${c.id===cb.turno?"actual":""} ${c.activo?"":"fuera"}"><div class="c-cab"><span class="c-nombre">${esc(c.id)}</span>${vida}</div>${c.pg!=null?barra(c.pg,c.pg_max):""}${c.descripcion?`<div class="c-desc">${esc(c.descripcion)}</div>`:""}${chips?`<div class="chips">${chips}</div>`:""}</div>`};
  $("orden").innerHTML=cb.combatientes.filter(c=>c.iniciativa!=null).map(c=>`<span class="${c.id===cb.turno?"actual":""} ${c.activo?"":"fuera"} ${c.bando==="enemigo"?"enemigo":""}">${esc(c.id)}</span>`).join("");
  // Centra el turno actual en la franja sin mover la página.
  const actual=document.querySelector("#orden .actual"); if(actual)$("orden").scrollLeft=actual.offsetLeft-$("orden").offsetLeft-$("orden").clientWidth/2+actual.offsetWidth/2;
  const cuad=cb.combatientes.filter(c=>c.bando==="cuadrilla"), ene=cb.combatientes.filter(c=>c.bando==="enemigo");
  $("combatientes").innerHTML=`<div class="grupo"><div class="eyebrow">Enemigos</div>${ene.map(tarjeta).join("")}</div><div class="grupo"><div class="eyebrow">Cuadrilla</div>${cuad.map(tarjeta).join("")}</div>`;
  // En combate, lo del combate va arriba y la tirada pedida solo si hay una.
  const wrap=document.querySelector(".wrap"), head=wrap.querySelector("header");
  head.after($("panelCombate")); $("panelCombate").after($("panelShalock"));
  const s=cb.shalock; if(!s)return;
  const r=s.recursos;
  const pips=(n,max)=>n==null?"–":`<span class="pips">${"●".repeat(Math.max(0,n))}<span class="vacio">${"○".repeat(Math.max(0,(max||n)-n))}</span></span>`;
  $("recursos").innerHTML=[["PG",`${s.pg}/${s.pg_max}`+(s.pg_temporales?` +${s.pg_temporales}`:"")],["CA",s.ca],...Object.entries(r.espacios||{}).map(([n,e])=>[`Espacios nivel ${n}`,pips(e.restantes,e.max)]),[`Pacto (nivel ${r.pacto?r.pacto.nivel:"–"})`,r.pacto?pips(r.pacto.restantes,r.pacto.max):"–"],["Maldición",pips(r.maldicion,1)],["Imposición",r.imposicion??"–"]]
    .map(([k,v])=>`<div class="rec"><span class="eyebrow">${k}</span><b>${v}</b></div>`).join("");
  const eco=s.economia||{}, tuyo2=cb.turno==="Shalock";
  $("economia").innerHTML=[["Acción",eco.accion&&tuyo2],["Acción adicional",eco.adicional&&tuyo2],["Reacción",s.reaccion_usada]].map(([k,u])=>`<span class="${u?"usada":""}">${k}: ${u?"usada":"disponible"}</span>`).join("");
  const ef=s.efectos;
  $("efectos").innerHTML=[s.concentracion?`Concentrado: ${s.concentracion}`:"",ef.bendecido?"Bendecido (+1d4)":"",ef.maldicion?`Maldición: ${ef.maldicion}`:"",ef.maleficio?`Maleficio: ${ef.maleficio}`:""].filter(Boolean).map(x=>`<span class="chip on">${esc(x)}</span>`).join("")||`<span class="chip">sin efectos activos</span>`;
  // Menús (se reconstruyen conservando lo elegido).
  const ad=[`<option value="">Ninguna</option>`,...s.opciones.filter(o=>o.tiempo==="adicional").map(o=>`<option value="op:${o.id}">${esc(o.nombre)}</option>`),`<option value="otra">Otra (escribirla)</option>`];
  $("selAdicional").innerHTML=ad.join(""); $("selAdicional").value=form.adicional;
  $("selAdicional").disabled=!!(eco.adicional&&tuyo2); if($("selAdicional").disabled){form.adicional="";$("selAdicional").value=""}
  const ac=[`<option value="">Elegir…</option>`,...s.acciones.map(a=>`<option value="atq:${a.id}">Atacar: ${esc(a.nombre)}</option>`),...s.opciones.filter(o=>o.tiempo==="accion").map(o=>`<option value="op:${o.id}">${esc(o.nombre)}</option>`),...s.comunes.map(x=>`<option value="com:${esc(x)}">${esc(x)}</option>`),`<option value="otra">Otra (escribirla)</option>`];
  $("selAccion").innerHTML=ac.join(""); $("selAccion").value=form.accion;
  $("selAccion").disabled=!!(eco.accion&&tuyo2); if($("selAccion").disabled){form.accion="";$("selAccion").value=""}
  $("cfgAdicional").innerHTML=campos("ad",form.adicional); $("cfgAccion").innerHTML=campos("ac",form.accion);
  restaurar(); revisar(); pintarDano(); pintarReaccion();
}

// Campos que pide cada elección.
function selector(key,lista,etiqueta){return `<label>${etiqueta}<select data-k="${key}">${lista.map(x=>typeof x==="object"?`<option value="${esc(x.v)}">${esc(x.t)}</option>`:`<option>${esc(x)}</option>`).join("")}</select></label>`}
// Espacios que alcanzan para un conjuro de nivel «minimo»: «1», «2»… (multiclase) o «pacto».
function espacios(minimo=1){
  const r=combate.shalock.recursos, out=[];
  Object.entries(r.espacios||{}).forEach(([n,e])=>{if(Number(n)>=minimo&&e.restantes>0)out.push({v:n,t:`nivel ${n} (${e.restantes} de ${e.max})`})});
  if(r.pacto&&r.pacto.restantes>0&&r.pacto.nivel>=minimo)out.push({v:"pacto",t:`pacto, nivel ${r.pacto.nivel} (${r.pacto.restantes} de ${r.pacto.max})`});
  return out;
}
const nivelDe=v=>v==="pacto"?combate.shalock.recursos.pacto.nivel:Number(v||1);
// Máximo de criaturas según el nivel del espacio (Bendición 3, Heroísmo y Orden 1; +1 por nivel extra).
const maxObjetivos=(o,p)=>(o.max_base||1)+nivelDe(form.c[`${p}_espacio`])-(o.nivel||1);
function campos(p,valor){
  if(!valor)return "";
  const s=combate.shalock, h=[];
  if(valor==="otra")return `<label>Qué hace<input data-k="${p}_texto" placeholder="Describe la acción"></label>`;
  if(valor.startsWith("com:"))return "";
  if(valor.startsWith("atq:")){
    const a=ataque(valor.slice(4));
    h.push(selector(`${p}_objetivo`,enemigos(),"Blanco"));
    h.push(`<div class="opciones"><label><input type="checkbox" data-k="${p}_ventaja"> Ventaja</label><label><input type="checkbox" data-k="${p}_desventaja"> Desventaja</label></div>`);
    if(a.castigo)h.push(`<div class="estado">El Castigo divino se decide después, si impactas.</div>`);
    return h.join("");
  }
  const o=opcion(valor.slice(3));
  h.push(`<div class="estado">${esc(o.efecto)}${o.escala?`<br>A nivel superior: ${esc(o.escala)}.`:""}</div>`);
  if(o.espacio)h.push(selector(`${p}_espacio`,espacios(o.nivel||1),"Espacio de conjuro"));
  if(o.objetivo==="enemigo")h.push(selector(`${p}_objetivo`,enemigos(),"Blanco"));
  if(o.objetivo==="aliado")h.push(selector(`${p}_objetivo`,aliados(),"A quién"));
  if(o.objetivo==="aliados"||o.objetivo==="enemigos"){
    const lista=o.objetivo==="aliados"?aliados():enemigos();
    h.push(`<div class="estado">Hasta ${maxObjetivos(o,p)} criatura(s) con este espacio.</div><div class="opciones">${lista.map(x=>`<label><input type="checkbox" data-k="${p}_obj_${esc(x)}"> ${esc(x)}</label>`).join("")}</div>`);
  }
  if(o.caracteristica)h.push(selector(`${p}_car`,["FUE","DES","CON","INT","SAB","CAR"],"Característica (desventaja en sus pruebas)"));
  if(o.palabra)h.push(`<label>Palabra<input data-k="${p}_palabra" placeholder="Huye, Suelta, Al suelo…"></label>`);
  if(o.puntos)h.push(`<label>Puntos de la reserva<input type="number" min="1" max="${s.recursos.imposicion}" data-k="${p}_puntos"></label>`);
  return h.join("");
}
function restaurar(){document.querySelectorAll("[data-k]").forEach(el=>{const v=form.c[el.dataset.k];if(v===undefined)return;if(el.type==="checkbox")el.checked=v;else el.value=v});document.querySelectorAll("[data-k]").forEach(el=>{if(el.type!=="checkbox"&&form.c[el.dataset.k]===undefined)form.c[el.dataset.k]=el.value})}
document.addEventListener("input",ev=>{const k=ev.target.dataset&&ev.target.dataset.k;if(!k)return;form.c[k]=ev.target.type==="checkbox"?ev.target.checked:ev.target.value;if(k.endsWith("_espacio"))pintarCombate(combate);else revisar()});
$("selAdicional").onchange=ev=>{form.adicional=ev.target.value;pintarCombate(combate)};
$("selAccion").onchange=ev=>{form.accion=ev.target.value;pintarCombate(combate)};
document.querySelectorAll("input[name=ordenAd]").forEach(x=>x.onchange=()=>{form.orden=x.value});
$("notas").oninput=ev=>{form.notas=ev.target.value};

// Reglas que la app revisa antes de enviar.
function revisar(){
  const s=combate.shalock, avisos=[], bloqueos=[];
  const ad=form.adicional.startsWith("op:")?opcion(form.adicional.slice(3)):null;
  const ac=form.accion.startsWith("op:")?opcion(form.accion.slice(3)):null;
  const conc=[ad,ac].filter(o=>o&&o.concentracion);
  if(conc.length>1)avisos.push(`Solo una concentración: ${conc[1].nombre} termina ${conc[0].nombre}.`);
  if(conc.length&&s.concentracion)avisos.push(`Dejas de concentrarte en ${s.concentracion}.`);
  if(ad&&ad.espacio&&ac&&ac.espacio)bloqueos.push("Si conjuras con la acción adicional, con la acción solo puedes lanzar un truco.");
  const gasto={};
  [["ad",ad],["ac",ac]].forEach(([p,o])=>{if(o&&o.espacio){const k=form.c[`${p}_espacio`];if(!k)bloqueos.push(`${o.nombre}: no te quedan espacios de nivel suficiente.`);else gasto[k]=(gasto[k]||0)+1}});
  Object.entries(gasto).forEach(([k,n])=>{const e=k==="pacto"?s.recursos.pacto:s.recursos.espacios[k];if(!e||n>e.restantes)bloqueos.push("No te alcanzan los espacios de conjuro.")});
  if(ad&&ad.id==="maldicion"&&!s.recursos.maldicion)bloqueos.push("La Maldición ya se usó; vuelve con un descanso.");
  if(ac&&ac.id==="imposicion"&&!(Number(form.c.ac_puntos)>0&&Number(form.c.ac_puntos)<=s.recursos.imposicion))bloqueos.push("Indica cuántos puntos de la reserva usas.");
  [["ad",ad],["ac",ac]].forEach(([p,o])=>{if(o&&(o.objetivo==="aliados"||o.objetivo==="enemigos")){const lista=o.objetivo==="aliados"?aliados():enemigos(),n=lista.filter(x=>form.c[`${p}_obj_${x}`]).length,max=maxObjetivos(o,p);if(!n||n>max)bloqueos.push(`${o.nombre}: elige de 1 a ${max} criatura(s).`)}});
  if(combate.turno!=="Shalock")bloqueos.push("Espera tu turno: puedes dejarlo armado.");
  if(!form.accion&&!form.adicional)bloqueos.push("Elige al menos una acción.");
  $("avisos").innerHTML=[...bloqueos.map(x=>`<span style="color:var(--bad)">${esc(x)}</span>`),...avisos.map(esc)].join("<br>");
  $("enviarTurno").disabled=bloqueos.length>0||!!envioTurno&&false;
  return bloqueos.length===0;
}

function tirarExpr(expr,critico,gwf){
  const m=/^(\d+)d(\d+)([+-]\d+)?$/.exec(expr); if(!m)return{expresion:expr,dados:[],total:Number(expr)||0};
  const n=Number(m[1])*(critico?2:1),caras=Number(m[2]),bono=Number(m[3]||0);
  // Combate con armas a dos manos: repite una vez cada 1 o 2.
  const dados=Array.from({length:n},()=>{let x=d(caras);if(gwf&&x<=2)x=d(caras);return x});
  return{expresion:`${n}d${caras}${bono?(bono>0?"+":"")+bono:""}`,dados,total:dados.reduce((a,b)=>a+b,0)+bono};
}

function describir(p,valor){
  if(!valor)return null;
  if(valor==="otra")return{tipo:"otra",texto:form.c[`${p}_texto`]||""};
  if(valor.startsWith("com:"))return{tipo:"comun",nombre:valor.slice(4)};
  if(valor.startsWith("atq:"))return{tipo:"ataque",id:valor.slice(4)};
  const o=opcion(valor.slice(3)), x={tipo:"opcion",id:o.id,nombre:o.nombre};
  if(o.objetivo==="enemigo"||o.objetivo==="aliado")x.objetivo=form.c[`${p}_objetivo`];
  if(o.objetivo==="aliados"||o.objetivo==="enemigos")x.objetivos=(o.objetivo==="aliados"?aliados():enemigos()).filter(a=>form.c[`${p}_obj_${a}`]);
  if(o.objetivo==="propio")x.objetivo="Shalock";
  if(o.espacio){x.espacio=form.c[`${p}_espacio`];x.nivel=nivelDe(x.espacio)}
  if(o.caracteristica)x.caracteristica=form.c[`${p}_car`];
  if(o.palabra)x.palabra=form.c[`${p}_palabra`]||"";
  if(o.puntos)x.puntos=Number(form.c[`${p}_puntos`]);
  if(o.concentracion)x.concentracion=true;
  return x;
}

function tirarTurno(){
  const s=combate.shalock, ad=describir("ad",form.adicional), ac=describir("ac",form.accion);
  // Efectos vigentes al momento de la acción: los de antes y la adicional si va antes.
  let maldicion=s.efectos.maldicion, maleficio=s.efectos.maleficio, abrasador=s.efectos.abrasador||false;
  if(ad&&form.orden==="antes"){if(ad.id==="maldicion")maldicion=ad.objetivo;if(ad.id==="maleficio")maleficio=ad.objetivo;if(ad.id==="abrasador")abrasador=ad.nivel||1}
  if(ac&&ac.tipo==="ataque")Object.assign(ac,tirarAtaque(ac.id,form.c.ac_objetivo,form.c.ac_ventaja?"ventaja":form.c.ac_desventaja?"desventaja":null,{maldicion,maleficio,abrasador}));
  if(ac&&ac.id==="curar")ac.curacion=tirarExpr(`${ac.nivel||1}d8+4`,false,false);
  return{tipo:"turno",adicional:ad,accion:ac,orden:form.orden,notas:form.notas,ts:Date.now()};
}

// Paso 1: solo el d20. El vigilante del PC devuelve el veredicto sin mostrar la CA.
function tirarAtaque(id,obj,modo,ef){
  const s=combate.shalock, a=ataque(id);
  const d20=modo?[d(20),d(20)]:[d(20)], natural=modo==="ventaja"?Math.max(...d20):modo==="desventaja"?Math.min(...d20):d20[0];
  const bend=s.efectos.bendecido?d(4):0;
  return{tipo:"ataque",fase:"ataque",id,accion:a.nombre,clase:a.clase,objetivo:obj,d20,natural,bono:a.bono,bendicion:bend,
         total:natural+a.bono+bend,modo,critico_desde:ef.maldicion===obj?19:20,efectos:ef};
}
let enCurso=null; // ataque esperando veredicto o daño
try{enCurso=JSON.parse(localStorage.getItem("mesa_en_curso")||"null")}catch(e){}
function guardarEnCurso(){try{localStorage.setItem("mesa_en_curso",JSON.stringify(enCurso))}catch(e){}}

// Paso 2: con el veredicto, el daño (y el Castigo divino, que se decide al impactar).
function pintarDano(){
  const p=$("panelDano"); if(!combate||!enCurso){p.hidden=true;return}
  const v=combate.resolucion&&combate.resolucion.tirada===enCurso.tirada?combate.resolucion:null;
  p.hidden=false;
  if(!v){$("veredicto").textContent=`${enCurso.accion} contra ${enCurso.objetivo}: ${enCurso.total}. Esperando si impacta…`;$("opcDano").hidden=true;return}
  $("veredicto").textContent=`${enCurso.accion} contra ${enCurso.objetivo}: `+(v.critico?"¡CRÍTICO!":v.impacta?"impactas.":"fallas.")+(v.reaccion?` ${v.reaccion}.`:"");
  $("opcDano").hidden=!v.impacta;
  const a=ataque(enCurso.id), esp=espacios();
  $("lblCastigoDano").hidden=!(a&&a.castigo&&esp.length);
  $("espCastigo").innerHTML=esp.map(x=>`<option value="${x.v}">${esc(x.t)} → ${Math.min(5,1+nivelDe(x.v))}d8</option>`).join("");
  if(!v.impacta)$("cerrarDano").hidden=false;
}
$("cerrarDano").onclick=()=>{enCurso=null;guardarEnCurso();$("cerrarDano").hidden=true;pintarDano()};
$("tirarDano").addEventListener("click",async()=>{
  const v=combate.resolucion, a=ataque(enCurso.id), ef=enCurso.efectos||{}, crit=!!v.critico, obj=enCurso.objetivo;
  if(!enCurso.dano){
    const danos=[Object.assign(tirarExpr(a.dano,crit,a.gwf),{tipo:a.tipo_dano})];
    if(ef.maldicion===obj)danos.push({expresion:"+2",dados:[],total:2,tipo:a.tipo_dano+" (Maldición)"});
    if(ef.maleficio===obj)danos.push(Object.assign(tirarExpr("1d6",crit,a.gwf),{tipo:"necrótico"}));
    if(ef.abrasador&&a.clase==="arma")danos.push(Object.assign(tirarExpr(`${Number(ef.abrasador)||1}d6`,crit,a.gwf),{tipo:"fuego (Castigo abrasador)"}));
    const castigo=a.castigo&&$("castigoDano").checked&&!$("lblCastigoDano").hidden;
    // Castigo divino: 2d8 con espacio de nivel 1, +1d8 por nivel, máximo 5d8.
    if(castigo)danos.push(Object.assign(tirarExpr(`${Math.min(5,1+nivelDe($("espCastigo").value))}d8`,crit,a.gwf),{tipo:"radiante (Castigo divino)"}));
    const ts=Date.now();
    enCurso.dano={id:`${ts}-${Math.random().toString(36).slice(2,7)}`,t:{tipo:"dano",ref:enCurso.tirada,accion:a.nombre,objetivo:obj,critico:crit,castigo,espacio_castigo:castigo?$("espCastigo").value:null,danos,ts}};
    guardarEnCurso();
  }
  const t=enCurso.dano.t, est=$("estadoDano");
  $("resDano").textContent=t.danos.map(x=>x.dados.length?`${x.expresion}: ${x.dados.join(" + ")}${/[+-]\d+$/.test(x.expresion)?" "+x.expresion.match(/[+-]\d+$/)[0].replace(/^([+-])/,"$1 "):""} = ${x.total} ${x.tipo}`:`${x.total} ${x.tipo}`).join("; ");
  est.className="estado";est.textContent="Enviando…";
  try{
    const r=await fetch(`${API}/repos/${cfg.repo}/contents/tiradas/${enCurso.dano.id}.json`,{method:"PUT",headers:cabeceras({"Content-Type":"application/json"}),body:JSON.stringify({message:"daño de Shalock",content:b64(JSON.stringify(t))})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    enCurso=null;guardarEnCurso();est.className="estado ok";est.textContent="Daño enviado al DM.";$("castigoDano").checked=false;pintarDano();
  }catch(e){est.className="estado bad";est.textContent=`No se pudo enviar (${e.message}). Aprieta de nuevo: se reenvía el mismo daño.`}
});

// Reacción: ataque de oportunidad cuando el DM la ofrece.
function pintarReaccion(){
  const rp=combate&&combate.reaccion_pendiente, p=$("panelReaccion");
  p.hidden=!rp||!!enCurso; if(p.hidden)return;
  $("motivoReaccion").textContent=rp.motivo;
  const armas=combate.shalock.acciones.filter(a=>a.clase==="arma");
  const prev=$("armaReaccion").value;
  $("armaReaccion").innerHTML=armas.map(a=>`<option value="${a.id}" ${a.id===prev?"selected":""}>${esc(a.nombre)}</option>`).join("");
}
async function enviarReaccion(t){
  const ts=Date.now(),id=`${ts}-${Math.random().toString(36).slice(2,7)}`;
  const r=await fetch(`${API}/repos/${cfg.repo}/contents/tiradas/${id}.json`,{method:"PUT",headers:cabeceras({"Content-Type":"application/json"}),body:JSON.stringify({message:"reacción de Shalock",content:b64(JSON.stringify(t))})});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return id;
}
$("atacarReaccion").addEventListener("click",async()=>{
  const s=combate.shalock, rp=combate.reaccion_pendiente;
  const atq=tirarAtaque($("armaReaccion").value,rp.objetivo,null,{maldicion:s.efectos.maldicion,maleficio:s.efectos.maleficio,abrasador:false});
  try{const id=await enviarReaccion({tipo:"reaccion",ataque:atq,ts:Date.now()});enCurso=Object.assign({tirada:id+".json"},atq);guardarEnCurso();$("panelReaccion").hidden=true;pintarDano()}
  catch(e){$("estadoReaccion").textContent=`No se pudo enviar (${e.message}).`}
});
$("dejarReaccion").addEventListener("click",async()=>{
  try{await enviarReaccion({tipo:"reaccion",ataque:null,decision:"no",ts:Date.now()});$("panelReaccion").hidden=true}
  catch(e){$("estadoReaccion").textContent=`No se pudo enviar (${e.message}).`}
});

function resumen(t){
  const out=[];
  // Desglose completo: cada dado, el modificador y el total, para poder comprobarlo.
  const parte=d=>{const m=/([+-]\d+)$/.exec(d.expresion);const mod=d.dados.length&&m?` ${m[1][0]} ${m[1].slice(1)}`:"";return d.dados.length?`${d.expresion}: ${d.dados.join(" + ")}${mod} = ${d.total} ${d.tipo}`:`${d.total} ${d.tipo}`};
  const txt=x=>!x?"":x.tipo==="ataque"?`${x.accion} → ${x.objetivo}: d20 ${x.d20.join(" / ")}${x.d20.length>1?` (se usa ${x.natural})`:""} ${x.bono>=0?"+":"−"} ${Math.abs(x.bono)}${x.bendicion?` + ${x.bendicion} (Bendición)`:""} = ${x.total}${x.critico?" · CRÍTICO":""}${x.danos?`. Daño si impacta: ${x.danos.map(parte).join("; ")}`:". El daño se tira si impacta."}`
    :x.tipo==="opcion"?`${x.nombre}${x.objetivo?` → ${x.objetivo}`:""}${x.objetivos?` → ${x.objetivos.join(", ")}`:""}${x.curacion?`: cura ${parte(Object.assign({tipo:"PG"},x.curacion))}`:""}`
    :x.tipo==="comun"?x.nombre:x.texto;
  if(t.adicional)out.push("Adicional: "+txt(t.adicional));
  if(t.accion)out.push("Acción: "+txt(t.accion));
  return out.join(" · ");
}

$("enviarTurno").addEventListener("click",async()=>{
  if(!envioTurno){if(!revisar())return;const ts=Date.now();envioTurno={id:`${ts}-${Math.random().toString(36).slice(2,7)}`,t:tirarTurno()}}
  const t=envioTurno.t, est=$("estadoTurno");
  $("resTurno").textContent=resumen(t);
  est.className="estado";est.textContent="Enviando…";$("enviarTurno").disabled=true;
  try{
    const r=await fetch(`${API}/repos/${cfg.repo}/contents/tiradas/${envioTurno.id}.json`,{method:"PUT",headers:cabeceras({"Content-Type":"application/json"}),body:JSON.stringify({message:"turno de Shalock",content:b64(JSON.stringify(t))})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    if(t.accion&&t.accion.tipo==="ataque"){enCurso=Object.assign({tirada:envioTurno.id+".json"},t.accion);guardarEnCurso()}
    envioTurno=null;Object.assign(form,{adicional:"",accion:"",notas:"",c:{}});$("notas").value="";
    $("enviarTurno").textContent="Tirar y enviar turno";
    est.className="estado ok";est.textContent="Turno enviado al DM.";
    pintarCombate(combate);
  }catch(e){
    $("enviarTurno").textContent="Reenviar el mismo turno";$("enviarTurno").disabled=false;
    est.className="estado bad";est.textContent=`No se pudo enviar (${e.message}). Aprieta de nuevo: se reenvía el mismo resultado.`;
  }
});

async function sondear(){
  if(!cfg.repo||!cfg.token)return;
  try{
    const h=cabeceras(etag?{"If-None-Match":etag}:{});
    const r=await fetch(`${API}/repos/${cfg.repo}/contents/estado.json`,{headers:h,cache:"no-store"});
    if(r.status===304){$("conexion").textContent="Conectado";return}
    if(r.status===401||r.status===403){$("conexion").textContent="El token no sirve o venció";return}
    if(r.status===404){$("conexion").textContent="Conectado; el DM aún no publica la mesa";$("mensaje").textContent="Esperando al DM…";return}
    if(!r.ok){$("conexion").textContent="Error "+r.status;return}
    etag=r.headers.get("ETag");
    const j=await r.json();
    pintar(JSON.parse(deB64(j.content)));
    $("conexion").textContent="Conectado";
  }catch(e){$("conexion").textContent="Sin conexión"}
}

function arrancar(){
  leerCfg();$("repo").value=cfg.repo;$("token").value=cfg.token;
  if(!cfg.repo||!cfg.token){$("ajustes").hidden=false;$("mensaje").textContent="Falta la conexión: pon el repositorio y el token.";return}
  if(sondeo)clearInterval(sondeo);etag=null;sondear();sondeo=setInterval(sondear,2000);
}

$("abrirAjustes").addEventListener("click",()=>{$("ajustes").hidden=!$("ajustes").hidden});
$("guardar").addEventListener("click",()=>{cfg.repo=$("repo").value.trim();cfg.token=$("token").value.trim();guardarCfg();$("ajustes").hidden=true;arrancar()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sondear()});

$("tirar").addEventListener("click",async()=>{
  if(!pedido)return;
  $("tirar").disabled=true;
  // Si un envío falló, se reenvía la misma tirada: nunca se vuelve a tirar.
  if(!pendiente||pendiente.tirada.pedido!==pedido.id){
    const m=/^(\d*)d(\d+)$/i.exec(pedido.expresion||"1d20")||[0,"1","20"];
    const n=Number(m[1]||1),caras=Number(m[2]),mod=Number(pedido.mod)||0;
    const dados=Array.from({length:n},()=>d(caras)),ts=Date.now();
    pendiente={id:`${ts}-${Math.random().toString(36).slice(2,7)}`,tirada:{pedido:pedido.id,nombre:pedido.nombre,expresion:pedido.expresion||"1d20",dados,mod,total:dados.reduce((a,b)=>a+b,0)+mod,ts}};
    const el=$("dado");el.classList.remove("rueda");void el.offsetWidth;el.classList.add("rueda");
  }
  const {id,tirada}=pendiente,{dados,mod,total}=tirada;
  $("dado").textContent=dados.join(" · ");$("total").textContent=`${mod>=0?"+":"−"} ${Math.abs(mod)} = ${total}`;$("resultado").hidden=false;
  const est=$("estado");est.className="estado";est.textContent="Enviando…";
  try{
    const r=await fetch(`${API}/repos/${cfg.repo}/contents/tiradas/${id}.json`,{method:"PUT",headers:cabeceras({"Content-Type":"application/json"}),body:JSON.stringify({message:"tirada "+(pedido.nombre||""),content:b64(JSON.stringify(tirada))})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    marcarEnviado(pedido.id);pendiente=null;
    est.className="estado ok";est.textContent=`Enviada: ${dados.join(", ")} ${fmtMod(mod)} → ${total}`;
  }catch(e){
    $("tirar").disabled=false;$("tirar").textContent="Reenviar la misma tirada";
    est.className="estado bad";est.textContent=`No se pudo enviar (${e.message}). Revisa la conexión y aprieta de nuevo, o escríbele el total al DM.`;
  }
});


arrancar();
</script>
