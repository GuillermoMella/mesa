<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mesa de Shalock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Alegreya+Sans:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Una columna de mesa: lo que dice el DM, la tirada pedida, el envío. Tema oscuro deliberado. */
:root{
  --bg:#14110f; --panel:#1f1a17; --line:#3a302a; --fg:#e8dfd4; --muted:#a3968a;
  --ember:#d9772b; --ok:#7fae6a; --bad:#cf5b4f;
  --display:"Cinzel",Georgia,serif; --body:"Alegreya Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header{display:flex;justify-content:space-between;align-items:end;gap:12px}
h1{font-family:var(--display);font-size:1.5rem;margin:0;letter-spacing:.04em}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:10px}
#mensaje{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.tirada{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.nombre{font-weight:700;font-size:1.1rem}
.mod{font-family:var(--mono);color:var(--ember)}
button{font:inherit;font-weight:700;background:var(--ember);color:var(--bg);border:0;border-radius:6px;padding:14px 18px;cursor:pointer;width:100%}
button.sec{background:transparent;color:var(--muted);border:1px solid var(--line);padding:6px 10px;width:auto;font-weight:400;font-size:.85rem}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
input{font:inherit;font-family:var(--mono);font-size:.85rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:10px;width:100%}
.resultado{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dado{font-family:var(--mono);font-size:2.6rem;line-height:1}
.total{font-family:var(--mono);font-size:1.2rem;color:var(--muted)}
.estado{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.estado.ok{color:var(--ok)} .estado.bad{color:var(--bad)}
.pie{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.turno{font-family:var(--display);font-size:1.05rem}
.lista{display:grid;gap:8px}
.c{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:4px}
.c.actual{border-color:var(--ember)}
.c.fuera{opacity:.45}
.c-cab{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.c-nombre{font-weight:700}
.c-dato{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.c-desc{font-size:.9rem;color:var(--muted)}
.barra{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--ok)}
.barra.media>i{background:var(--ember)} .barra.baja>i{background:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.chip.on{border-color:var(--ember);color:var(--ember)}
.recursos{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.rec{border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.rec b{font-family:var(--mono);font-size:1.1rem;display:block}
.acciones{display:grid;gap:8px}
.acc{background:transparent;color:var(--fg);border:1px solid var(--line);text-align:left;font-weight:400;padding:10px 12px}
.acc.sel{border-color:var(--ember);background:#2a211b}
.acc small{display:block;font-family:var(--mono);color:var(--muted)}
select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:10px;width:100%}
.opciones{display:flex;gap:14px;flex-wrap:wrap;font-size:.95rem}
.opciones label{display:flex;gap:6px;align-items:center;color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.dado.rueda{animation:r .35s ease-out}@keyframes r{from{transform:rotate(-200deg) scale(.6);opacity:.3}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="eyebrow">Proyecto Gran Torre</div><h1>Mesa de Shalock</h1></div>
    <button class="sec" id="abrirAjustes">Conexión</button>
  </header>

  <section class="panel" id="ajustes" hidden>
    <div class="eyebrow">Conexión con la mesa</div>
    <label for="repo">Repositorio de datos<input id="repo" placeholder="usuario/mesa-datos" autocomplete="off"></label>
    <label for="token">Token<input id="token" type="password" placeholder="github_pat_…" autocomplete="off"></label>
    <button id="guardar">Guardar en este dispositivo</button>
    <div class="estado">Se guarda solo en este navegador.</div>
  </section>

  <section class="panel" aria-live="polite">
    <div class="eyebrow">Lo que dice el DM</div>
    <p id="mensaje">Conectando…</p>
  </section>

  <section class="panel">
    <div class="eyebrow">Tirada pedida</div>
    <div class="tirada"><span class="nombre" id="nombre">Ninguna por ahora</span><span class="mod" id="mod"></span></div>
    <div class="resultado" id="resultado" hidden><span class="dado" id="dado">–</span><span class="total" id="total"></span></div>
    <button id="tirar" disabled>Tirar y enviar al DM</button>
    <div class="estado" id="estado"></div>
  </section>

  <section class="panel" id="panelCombate" hidden>
    <div class="eyebrow">Combate</div>
    <div class="turno" id="turno"></div>
    <div class="lista" id="combatientes"></div>
  </section>

  <section class="panel" id="panelShalock" hidden>
    <div class="eyebrow">Shalock</div>
    <div class="recursos" id="recursos"></div>
    <div class="chips" id="efectos"></div>
    <div class="eyebrow">Atacar</div>
    <div class="acciones" id="acciones"></div>
    <label for="objetivo">Blanco<select id="objetivo"></select></label>
    <div class="opciones">
      <label><input type="checkbox" id="ventaja"> Ventaja</label>
      <label><input type="checkbox" id="desventaja"> Desventaja</label>
      <label id="lblCastigo"><input type="checkbox" id="castigo"> Castigo divino (2d8)</label>
    </div>
    <div class="resultado" id="resAtaque" hidden><span class="dado" id="dadoAtaque">–</span><span class="total" id="totalAtaque"></span></div>
    <button id="atacar" disabled>Tirar ataque y enviar</button>
    <div class="estado" id="estadoAtaque"></div>
  </section>

  <div class="pie"><span id="conexion">Sin conectar</span><span id="hora"></span></div>
</div>

<script>
const $=id=>document.getElementById(id);
const API="https://api.github.com";
let cfg={repo:"",token:""}, etag=null, pedido=null, pendiente=null, enviados=new Set(), sondeo=null;

function leerCfg(){try{cfg=JSON.parse(localStorage.getItem("mesa_cfg")||"{}");}catch(e){cfg={}}cfg.repo=cfg.repo||"";cfg.token=cfg.token||""}
function guardarCfg(){try{localStorage.setItem("mesa_cfg",JSON.stringify(cfg))}catch(e){}}
try{enviados=new Set(JSON.parse(localStorage.getItem("mesa_enviados")||"[]"))}catch(e){}
function marcarEnviado(id){enviados.add(id);try{localStorage.setItem("mesa_enviados",JSON.stringify([...enviados].slice(-50)))}catch(e){}}

const fmtMod=m=>(m>=0?"+":"")+m;
function d(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return 1+(a[0]%n)}
function b64(s){const b=new TextEncoder().encode(s);let t="";for(const x of b)t+=String.fromCharCode(x);return btoa(t)}
function deB64(s){const t=atob(s.replace(/\n/g,""));return new TextDecoder().decode(Uint8Array.from(t,c=>c.charCodeAt(0)))}
function cabeceras(extra){return Object.assign({"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},extra||{})}

function pintar(e){
  $("mensaje").textContent=e.mensaje||"Sin novedades.";
  pedido=e.tirada||null;
  if(pedido){
    $("nombre").textContent=pedido.nombre||"Tirada";
    $("mod").textContent=(pedido.expresion||"1d20")+" "+fmtMod(Number(pedido.mod)||0);
    $("tirar").disabled=enviados.has(pedido.id);
    if(!pendiente||pendiente.tirada.pedido!==pedido.id)$("tirar").textContent="Tirar y enviar al DM";
  }else{$("nombre").textContent="Ninguna por ahora";$("mod").textContent="";$("tirar").disabled=true}
  if(e.actualizado)$("hora").textContent="Actualizado "+new Date(e.actualizado).toLocaleTimeString();
  pintarCombate(e.combate||null);
}

// ---- Combate ----
let combate=null, accionSel=null, envioAtaque=null;
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function barra(pg,max){const r=max?pg/max:0;return `<div class="barra ${r<=.25?"baja":r<=.5?"media":""}"><i style="width:${Math.max(0,Math.min(100,r*100))}%"></i></div>`}
function pintarCombate(cb){
  combate=cb;
  $("panelCombate").hidden=!cb; $("panelShalock").hidden=!(cb&&cb.shalock);
  if(!cb)return;
  $("turno").textContent=`Ronda ${cb.ronda}`+(cb.turno?` · turno de ${cb.turno}`:"");
  $("combatientes").innerHTML=cb.combatientes.map(c=>{
    const vida=c.pg!=null?`<span class="c-dato">PG ${c.pg}/${c.pg_max}${c.pg_temporales?` +${c.pg_temporales}`:""}${c.ca!=null?` · CA ${c.ca}`:""}</span>`:`<span class="c-dato">${esc(c.estado)}</span>`;
    const chips=[...c.condiciones.map(x=>`<span class="chip">${esc(x)}</span>`),c.concentracion?`<span class="chip on">concentrado: ${esc(c.concentracion)}</span>`:""].join("");
    return `<div class="c ${c.id===cb.turno?"actual":""} ${c.activo?"":"fuera"}"><div class="c-cab"><span class="c-nombre">${esc(c.id)}</span>${vida}</div>${c.pg!=null?barra(c.pg,c.pg_max):""}${c.descripcion?`<div class="c-desc">${esc(c.descripcion)}</div>`:""}${chips?`<div class="chips">${chips}</div>`:""}</div>`}).join("");
  const s=cb.shalock; if(!s)return;
  const r=s.recursos;
  $("recursos").innerHTML=[["PG",`${s.pg}/${s.pg_max}`+(s.pg_temporales?` +${s.pg_temporales}`:"")],["CA",s.ca],["Espacios paladín",r.espacios_paladin],["Espacio de pacto",r.espacios_pacto],["Maldición",r.maldicion],["Imposición",r.imposicion]]
    .map(([k,v])=>`<div class="rec"><span class="eyebrow">${k}</span><b>${esc(v??"–")}</b></div>`).join("");
  const ef=s.efectos;
  $("efectos").innerHTML=[ef.bendecido?"Bendecido (+1d4)":"",ef.maldicion?`Maldición: ${ef.maldicion}`:"",ef.maleficio?`Maleficio: ${ef.maleficio}`:""].filter(Boolean).map(x=>`<span class="chip on">${esc(x)}</span>`).join("")||`<span class="chip">sin efectos activos</span>`;
  $("acciones").innerHTML=s.acciones.map(a=>`<button class="acc ${accionSel===a.id?"sel":""}" data-id="${a.id}">${esc(a.nombre)}<small>${a.bono>=0?"+":""}${a.bono} · ${esc(a.dano)} ${esc(a.tipo_dano)}${a.alcance?` · ${a.alcance} pies`:""}</small></button>`).join("");
  document.querySelectorAll(".acc").forEach(b=>b.onclick=()=>{accionSel=b.dataset.id;pintarCombate(combate)});
  const previo=$("objetivo").value;
  $("objetivo").innerHTML=cb.combatientes.filter(c=>c.bando==="enemigo"&&c.activo).map(c=>`<option ${c.id===previo?"selected":""}>${esc(c.id)}</option>`).join("");
  const acc=s.acciones.find(a=>a.id===accionSel);
  $("lblCastigo").hidden=!(acc&&acc.castigo&&(r.espacios_paladin>0||r.espacios_pacto>0));
  $("atacar").disabled=!acc||!$("objetivo").value||!!envioAtaque;
}

function tirarExpr(expr,critico,gwf){
  const m=/^(\d+)d(\d+)([+-]\d+)?$/.exec(expr); if(!m)return{expresion:expr,dados:[],total:Number(expr)||0};
  const n=Number(m[1])*(critico?2:1),caras=Number(m[2]),bono=Number(m[3]||0);
  // Combate con armas a dos manos: repite una vez cada 1 o 2.
  const dados=Array.from({length:n},()=>{let x=d(caras);if(gwf&&x<=2)x=d(caras);return x});
  return{expresion:`${n}d${caras}${bono?(bono>0?"+":"")+bono:""}`,dados,total:dados.reduce((a,b)=>a+b,0)+bono};
}

$("ventaja").onchange=()=>{if($("ventaja").checked)$("desventaja").checked=false};
$("desventaja").onchange=()=>{if($("desventaja").checked)$("ventaja").checked=false};
$("objetivo").onchange=()=>pintarCombate(combate);

$("atacar").addEventListener("click",async()=>{
  const s=combate&&combate.shalock, acc=s&&s.acciones.find(a=>a.id===accionSel), obj=$("objetivo").value;
  if(!acc||!obj)return;
  if(!envioAtaque){
    const modo=$("ventaja").checked?"ventaja":$("desventaja").checked?"desventaja":null;
    const d20=modo?[d(20),d(20)]:[d(20)], natural=modo==="ventaja"?Math.max(...d20):modo==="desventaja"?Math.min(...d20):d20[0];
    const bend=s.efectos.bendecido?d(4):0;
    const critico=natural>=(s.efectos.maldicion===obj?19:20);
    const danos=[Object.assign(tirarExpr(acc.dano,critico,acc.gwf),{tipo:acc.tipo_dano})];
    if(s.efectos.maldicion===obj)danos.push({expresion:"+2",dados:[],total:2,tipo:acc.tipo_dano+" (Maldición)"});
    if(s.efectos.maleficio===obj)danos.push(Object.assign(tirarExpr("1d6",critico,acc.gwf),{tipo:"necrótico"}));
    const castigo=acc.castigo&&$("castigo").checked;
    if(castigo)danos.push(Object.assign(tirarExpr("2d8",critico,acc.gwf),{tipo:"radiante"}));
    const ts=Date.now();
    envioAtaque={id:`${ts}-${Math.random().toString(36).slice(2,7)}`,t:{tipo:"ataque",accion:acc.nombre,clase:acc.clase,objetivo:obj,d20,natural,bono:acc.bono,bendicion:bend,total:natural+acc.bono+bend,critico,castigo,modo,danos,ts}};
    const el=$("dadoAtaque");el.classList.remove("rueda");void el.offsetWidth;el.classList.add("rueda");
  }
  const t=envioAtaque.t;
  $("dadoAtaque").textContent=t.d20.join(" · ");
  $("totalAtaque").textContent=`ataque ${t.total}${t.critico?" · CRÍTICO":""} · daño ${t.danos.map(x=>x.total+" "+x.tipo).join(" + ")}`;
  $("resAtaque").hidden=false;
  const est=$("estadoAtaque");est.className="estado";est.textContent="Enviando…";$("atacar").disabled=true;
  try{
    const r=await fetch(`${API}/repos/${cfg.repo}/contents/tiradas/${envioAtaque.id}.json`,{method:"PUT",headers:cabeceras({"Content-Type":"application/json"}),body:JSON.stringify({message:"ataque "+t.accion,content:b64(JSON.stringify(t))})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    envioAtaque=null;$("atacar").textContent="Tirar ataque y enviar";$("castigo").checked=false;
    est.className="estado ok";est.textContent="Enviado al DM.";
  }catch(e){
    $("atacar").textContent="Reenviar el mismo ataque";$("atacar").disabled=false;
    est.className="estado bad";est.textContent=`No se pudo enviar (${e.message}). Aprieta de nuevo: se reenvía el mismo resultado.`;
  }
  pintarCombate(combate);
});

async function sondear(){
  if(!cfg.repo||!cfg.token)return;
  try{
    const h=cabeceras(etag?{"If-None-Match":etag}:{});
    const r=await fetch(`${API}/repos/${cfg.repo}/contents/estado.json`,{headers:h,cache:"no-store"});
    if(r.status===304){$("conexion").textContent="Conectado";return}
    if(r.status===401||r.status===403){$("conexion").textContent="El token no sirve o venció";return}
    if(r.status===404){$("conexion").textContent="Conectado; el DM aún no publica la mesa";$("mensaje").textContent="Esperando al DM…";return}
    if(!r.ok){$("conexion").textContent="Error "+r.status;return}
    etag=r.headers.get("ETag");
    const j=await r.json();
    pintar(JSON.parse(deB64(j.content)));
    $("conexion").textContent="Conectado";
  }catch(e){$("conexion").textContent="Sin conexión"}
}

function arrancar(){
  leerCfg();$("repo").value=cfg.repo;$("token").value=cfg.token;
  if(!cfg.repo||!cfg.token){$("ajustes").hidden=false;$("mensaje").textContent="Falta la conexión: pon el repositorio y el token.";return}
  if(sondeo)clearInterval(sondeo);etag=null;sondear();sondeo=setInterval(sondear,2000);
}

$("abrirAjustes").addEventListener("click",()=>{$("ajustes").hidden=!$("ajustes").hidden});
$("guardar").addEventListener("click",()=>{cfg.repo=$("repo").value.trim();cfg.token=$("token").value.trim();guardarCfg();$("ajustes").hidden=true;arrancar()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sondear()});

$("tirar").addEventListener("click",async()=>{
  if(!pedido)return;
  $("tirar").disabled=true;
  // Si un envío falló, se reenvía la misma tirada: nunca se vuelve a tirar.
  if(!pendiente||pendiente.tirada.pedido!==pedido.id){
    const m=/^(\d*)d(\d+)$/i.exec(pedido.expresion||"1d20")||[0,"1","20"];
    const n=Number(m[1]||1),caras=Number(m[2]),mod=Number(pedido.mod)||0;
    const dados=Array.from({length:n},()=>d(caras)),ts=Date.now();
    pendiente={id:`${ts}-${Math.random().toString(36).slice(2,7)}`,tirada:{pedido:pedido.id,nombre:pedido.nombre,expresion:pedido.expresion||"1d20",dados,mod,total:dados.reduce((a,b)=>a+b,0)+mod,ts}};
    const el=$("dado");el.classList.remove("rueda");void el.offsetWidth;el.classList.add("rueda");
  }
  const {id,tirada}=pendiente,{dados,mod,total}=tirada;
  $("dado").textContent=dados.join(" · ");$("total").textContent="total "+total;$("resultado").hidden=false;
  const est=$("estado");est.className="estado";est.textContent="Enviando…";
  try{
    const r=await fetch(`${API}/repos/${cfg.repo}/contents/tiradas/${id}.json`,{method:"PUT",headers:cabeceras({"Content-Type":"application/json"}),body:JSON.stringify({message:"tirada "+(pedido.nombre||""),content:b64(JSON.stringify(tirada))})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    marcarEnviado(pedido.id);pendiente=null;
    est.className="estado ok";est.textContent=`Enviada: ${dados.join(", ")} ${fmtMod(mod)} → ${total}`;
  }catch(e){
    $("tirar").disabled=false;$("tirar").textContent="Reenviar la misma tirada";
    est.className="estado bad";est.textContent=`No se pudo enviar (${e.message}). Revisa la conexión y aprieta de nuevo, o escríbele el total al DM.`;
  }
});

arrancar();
</script>
</body>
</html>
